# 本地 fork：wireguard-netstack v0.3.1 + UDP 扩展
# 上游 base commit：7e6ea79e241feb177c3fb3cfed4e793b1a594584
# 相对上游的改动：
#   - 去掉了 workspace 相对引用，让本 crate 可以独立编译
#   - 在 smoltcp 中启用了 `socket-udp` feature
#   - 新增用户态 UDP socket 支持（见 src/netstack.rs 里的 UdpHandle）
#   - 在 lib.rs 中重新导出 UdpHandle
#   - v0.4.0：无冲突临时端口分配、每 socket 通知、有界设备队列
[package]
name = "wireguard-netstack"
version = "0.3.2"
edition = "2021"
license = "GPL-3.0"
authors = ["Lorenzo Rizzotti <dev@dreaming.codes>", "warp-rust contributors"]
repository = "https://github.com/Dreaming-Codes/wireguard-hyper-connector"
description = "Userspace WireGuard tunnel with TCP/IP network stack (warp-rust fork with UDP support)"
keywords = ["wireguard", "vpn", "tunnel", "networking"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["config-file"]
config-file = ["doh", "dep:base64", "dep:serde", "dep:serde_ini"]
doh = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
# WireGuard implementation
gotatun = "0.2"

# 用户态 TCP/IP 栈。`socket-udp` 是本 fork 新增的；`proto-ipv6` v0.2.0 新增。
#
# v0.4.5 分片相关的 feature 说明（不要凭名字猜语义）：
# - `proto-ipv4-fragmentation`：同时打开 IPv4 出站分片和入站重组，是大 UDP
#   报文能走通的前提。
# - `fragmentation-buffer-size-8192`：**出站** fragmenter 的静态缓冲，直接决定
#   `UdpHandle::max_payload_for` 的 IPv4 上限（8192 - 20 - 8 = 8164）。
# - `reassembly-buffer-count-4`：并发**入站**重组槽位数。残包会占槽直到 60s
#   超时，4 个是内存与突发容量的折中。
# - `assembler-max-segment-count-16`：单个重组槽能容纳多少个「洞」。默认 4 对
#   7 片报文的乱序到达没有余量；16 足够且每个 socket 只多几百字节。注意它同时
#   作用于 TCP 乱序段重组，调大对 TCP 也是改善。
# - 不配 `reassembly-buffer-size-*`：`std` 蕴含 `alloc`，此时
#   `PacketAssembler::buffer` 是动态 `Vec<u8>`，该 feature 完全不参与编译，
#   配上只会让人误以为入站有 8KiB 上限保护。
# - 不配 `proto-ipv6-fragmentation`：smoltcp 0.13.1 里它只作用于 6LoWPAN
#   (`sixlowpan.rs`)，在本项目的 `medium-ip` 路径下不提供任何 IPv6 分片或重组
#   能力。出站 IPv6 超 MTU 由 `max_payload_for` 显式拒绝。
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ip",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "fragmentation-buffer-size-8192",
    "reassembly-buffer-count-4",
    "assembler-max-segment-count-16",
    "std",
    "log",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS (for DoH)
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
webpki-roots = { version = "1.0", optional = true }

# Error handling
thiserror = "2"

# Utilities
bytes = "1"
parking_lot = "0.12"
rand = "0.10"
base64 = { version = "0.22", optional = true }
log = "0.4"

# v0.2.2：作为 metrics facade 消费者；只有当主程序装上 exporter 时才生效
metrics = "0.24"

# Config parsing
serde = { version = "1", features = ["derive"], optional = true }
serde_ini = { version = "0.2", optional = true }

# Socket options
socket2 = "0.6"

# For zerocopy traits
zerocopy = "0.8"
